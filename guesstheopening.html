<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniQuiz - Indovina l'Opening (Solo Audio)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ============================================================
           RESET & VARIABILI
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #22223a;
            --text-primary: #ffffff;
            --text-secondary: #8a8aa0;
            --accent-pink: #ff6b9d;
            --accent-purple: #a855f7;
            --accent-blue: #4cc9f0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #f59e0b;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 107, 157, 0.04) 0%, transparent 50%);
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 900;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .logo-text {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .nav-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-stats i {
            color: var(--accent-purple);
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        /* ============================================================
           OPENING GAME - STILI SPECIFICI
           ============================================================ */
        .game-container {
            padding: 40px 0 20px;
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .game-header .audio-badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .game-header .audio-badge i {
            margin-right: 8px;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-bar .stat i {
            color: var(--accent-purple);
        }

        .stats-bar .stat .value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Audio Player - STILE SPETTACOLARE */
        .audio-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .audio-visual {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(255, 107, 157, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(168, 85, 247, 0.2);
            transition: var(--transition);
        }

        .audio-visual.playing {
            animation: pulse 1.5s ease-in-out infinite;
            border-color: var(--accent-purple);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.15);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.1);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 60px rgba(168, 85, 247, 0.2);
            }
        }

        .audio-visual .anime-cover {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-secondary);
            border: 3px solid rgba(255, 255, 255, 0.05);
        }

        .audio-visual .play-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .audio-visual .play-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.5);
        }

        .audio-visual .play-icon i {
            margin-left: 4px;
        }

        /* Waveform animato */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-top: 16px;
        }

        .waveform .bar {
            width: 4px;
            height: 10px;
            background: var(--accent-purple);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .waveform.playing .bar {
            animation: wave 0.8s ease-in-out infinite alternate;
        }

        .waveform.playing .bar:nth-child(1) { animation-delay: 0s; height: 20px; }
        .waveform.playing .bar:nth-child(2) { animation-delay: 0.1s; height: 35px; }
        .waveform.playing .bar:nth-child(3) { animation-delay: 0.2s; height: 25px; }
        .waveform.playing .bar:nth-child(4) { animation-delay: 0.3s; height: 40px; }
        .waveform.playing .bar:nth-child(5) { animation-delay: 0.4s; height: 30px; }
        .waveform.playing .bar:nth-child(6) { animation-delay: 0.5s; height: 45px; }
        .waveform.playing .bar:nth-child(7) { animation-delay: 0.6s; height: 20px; }
        .waveform.playing .bar:nth-child(8) { animation-delay: 0.7s; height: 35px; }
        .waveform.playing .bar:nth-child(9) { animation-delay: 0.8s; height: 25px; }
        .waveform.playing .bar:nth-child(10) { animation-delay: 0.9s; height: 40px; }
        .waveform.playing .bar:nth-child(11) { animation-delay: 0.2s; height: 30px; }
        .waveform.playing .bar:nth-child(12) { animation-delay: 0.5s; height: 20px; }

        @keyframes wave {
            0% { height: 10px; }
            100% { height: 45px; }
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .audio-controls button {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-controls button:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .audio-controls button.primary {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
        }

        .audio-controls button.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .audio-controls button.danger {
            background: linear-gradient(135deg, var(--accent-red), #dc2626);
            border: none;
        }

        .audio-controls button.danger:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(248, 113, 113, 0.3);
        }

        /* Timer */
        .timer {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .timer .time {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .option-btn:hover:not(.disabled) {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.15);
        }

        .option-btn.wrong {
            border-color: var(--accent-red);
            background: rgba(248, 113, 113, 0.15);
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn .letter {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            line-height: 28px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 10px;
            color: var(--text-secondary);
        }

        /* Feedback */
        .feedback {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--accent-purple);
            display: none;
            animation: fadeSlideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            border-left-color: var(--accent-green);
        }

        .feedback.wrong {
            border-left-color: var(--accent-red);
        }

        .feedback h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .feedback p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress */
        .progress-bar {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            height: 6px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Next button */
        .next-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .next-btn.show {
            display: block;
        }

        /* Result */
        .result-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .result-screen.show {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }

        .result-screen .big-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .result-screen h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .result-screen .score {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 12px 0;
        }

        .result-screen .restart-btn {
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .result-screen .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--bg-card);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.8rem;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .stats-bar .stat {
                justify-content: center;
            }
            .audio-visual {
                width: 150px;
                height: 150px;
            }
            .audio-visual .anime-cover {
                width: 120px;
                height: 120px;
            }
            .audio-visual .play-icon {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .navbar .container {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo {
                justify-content: center;
            }
            .nav-stats {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .game-header h1 {
                font-size: 1.4rem;
            }
            .option-btn {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
            .audio-wrapper {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- ============================================================
    NAVBAR
    ============================================================ -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-mask"></i></div>
                <span class="logo-text">AniQuiz</span>
            </a>
            <div class="nav-stats">
                <a href="../index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Torna indietro
                </a>
                <span><i class="fas fa-music"></i> Opening Quiz</span>
            </div>
        </div>
    </nav>

    <!-- ============================================================
    GAME
    ============================================================ -->
    <div class="game-container">
        
        <!-- Header -->
        <div class="game-header">
            <h1>🎵 Indovina l'Opening</h1>
            <p>🎧 Ascolta la sigla a occhi chiusi... indovina l'anime!</p>
            <div class="audio-badge">
                <i class="fas fa-headphones"></i> Solo Audio · Nessun video
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat">
                <i class="fas fa-question-circle"></i>
                Domanda: <span class="value" id="currentQuestion">0</span>/<span id="totalQuestions">10</span>
            </div>
            <div class="stat">
                <i class="fas fa-check-circle" style="color: var(--accent-green);"></i>
                Corrette: <span class="value" id="correctCount">0</span>
            </div>
            <div class="stat">
                <i class="fas fa-times-circle" style="color: var(--accent-red);"></i>
                Sbagliate: <span class="value" id="wrongCount">0</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Caricamento opening...</p>
        </div>

        <!-- Game Area -->
        <div id="gameArea" style="display: none;">
            
            <!-- Audio Player -->
            <div class="audio-wrapper">
                <div class="audio-visual" id="audioVisual">
                    <img 
                        class="anime-cover" 
                        id="animeCover" 
                        src="" 
                        alt="Copertina anime"
                        onerror="this.style.display='none'"
                    />
                    <div class="play-icon" id="playBtn" onclick="togglePlay()">
                        <i class="fas fa-play"></i>
                    </div>
                </div>

                <!-- Waveform -->
                <div class="waveform" id="waveform">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>

                <div class="timer">
                    ⏱️ <span class="time" id="timerDisplay">0:00</span> / <span id="totalDuration">0:30</span>
                </div>

                <div class="audio-controls">
                    <button class="primary" onclick="togglePlay()">
                        <i class="fas fa-play" id="playIcon"></i> <span id="playText">Play</span>
                    </button>
                    <button onclick="resetAudio()">
                        <i class="fas fa-undo"></i> Ripeti
                    </button>
                </div>
            </div>

            <!-- Options -->
            <div class="options-grid" id="optionsGrid">
                <!-- Generate via JS -->
            </div>

            <!-- Feedback -->
            <div class="feedback" id="feedback">
                <h3 id="feedbackTitle">✅ Corretto!</h3>
                <p id="feedbackText">Dettaglio</p>
            </div>

            <!-- Next Button -->
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                <i class="fas fa-arrow-right"></i> Prossima domanda
            </button>

        </div>

        <!-- Result -->
        <div class="result-screen" id="resultScreen">
            <div class="big-icon">🏆</div>
            <h2>Quiz completato!</h2>
            <div class="score" id="finalScore">0/10</div>
            <p id="resultMessage">Ottimo lavoro!</p>
            <button class="restart-btn" onclick="restartGame()">
                <i class="fas fa-redo"></i> Ricomincia
            </button>
        </div>

    </div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // DATABASE OPENING (con copertine anime)
        // ============================================================
        const OPENING_DB = [
            {
                anime: "Attack on Titan",
                videoId: "8OkpRK2_gVs",
                cover: "https://anilist.co/img/header/16498.jpg",
                start: 0,
                duration: 30
            },
            {
                anime: "Demon Slayer",
                videoId: "pmanD_s7G3U",
                cover: "https://anilist.co/img/header/101922.jpg",
                start: 0,
                duration: 30
            },
            {
                anime: "Naruto",
                videoId: "MvH9eu7xg3g",
                cover: "https://anilist.co/img/header/20.jpg",
                start: 0,
                duration: 30
            },
            {
                anime: "One Piece",
                videoId: "Xa2bpzAe6Sk",
                cover: "https://anilist.co/img/header/21.jpg",
                start: 0,
                duration: 30
            },
            {

        ];

        // ============================================================
        // GAME LOGIC
        // ============================================================
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isAnswered = false;
        let totalQuestions = 10;
        let player = null;
        let isPlaying = false;
        let timerInterval = null;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateQuestions() {
            const shuffled = shuffleArray([...OPENING_DB]);
            const selected = shuffled.slice(0, totalQuestions);
            
            return selected.map((item) => {
                const others = OPENING_DB.filter(a => a.anime !== item.anime);
                const shuffledOthers = shuffleArray([...others]).slice(0, 3);
                const options = shuffleArray([
                    { text: item.anime, isCorrect: true },
                    ...shuffledOthers.map(a => ({ text: a.anime, isCorrect: false }))
                ]);
                
                return {
                    ...item,
                    options: options
                };
            });
        }

        function loadYouTubeAPI() {
            if (window.YT) {
                initPlayer();
                return;
            }

            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);

            window.onYouTubeIframeAPIReady = () => {
                initPlayer();
            };
        }

        function initPlayer() {
            const q = questions[currentIndex];
            if (!q) return;

            player = new YT.Player('youtubePlayer', {
                height: '0',
                width: '0',
                videoId: q.videoId,
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    showinfo: 0,
                    start: q.start,
                    end: q.start + q.duration
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            loadQuestionUI();
            updateTimer();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                // Quando finisce, ferma tutto
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            }
        }

        function togglePlay() {
            if (!player) return;

            if (isPlaying) {
                player.pauseVideo();
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            } else {
                player.playVideo();
                isPlaying = true;
                document.getElementById('playIcon').className = 'fas fa-pause';
                document.getElementById('playText').textContent = 'Pausa';
                document.getElementById('audioVisual').classList.add('playing');
                document.getElementById('waveform').classList.add('playing');
                updateTimer();
            }
        }

        function resetAudio() {
            if (!player) return;
            const q = questions[currentIndex];
            player.seekTo(q.start);
            player.pauseVideo();
            isPlaying = false;
            document.getElementById('playIcon').className = 'fas fa-play';
            document.getElementById('playText').textContent = 'Play';
            document.getElementById('audioVisual').classList.remove('playing');
            document.getElementById('waveform').classList.remove('playing');
            clearInterval(timerInterval);
            updateTimer();
        }

        function updateTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime() || 0;
                    const q = questions[currentIndex];
                    const elapsed = current - (q.start || 0);
                    const total = q.duration || 30;
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = Math.floor(elapsed % 60);
                    document.getElementById('timerDisplay').textContent = 
                        `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    document.getElementById('totalDuration').textContent = 
                        `${Math.floor(total / 60)}:${Math.floor(total % 60).toString().padStart(2, '0')}`;
                }
            }, 100);
        }

        function loadQuestionUI() {
            if (currentIndex >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentIndex];
            isAnswered = false;
            
            // Aggiorna stats
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('progressFill').style.width = ((currentIndex) / questions.length * 100) + '%';

            // Aggiorna cover
            const cover = document.getElementById('animeCover');
            cover.src = q.cover || '';
            cover.style.display = q.cover ? 'block' : 'none';

            // Genera opzioni
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt.text}`;
                btn.dataset.correct = opt.isCorrect;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                grid.appendChild(btn);
            });

            // Nascondi feedback e next
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            
            // Reset audio
            resetAudio();
        }

        function selectOption(btn, isCorrect) {
            if (isAnswered) return;
            isAnswered = true;

            // Ferma l'audio
            if (player && isPlaying) {
                player.pauseVideo();
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            }

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            if (isCorrect) {
                btn.classList.add('correct');
                correctCount++;
                feedback.className = 'feedback show correct';
                feedbackTitle.textContent = '🎵 Perfetto!';
                feedbackText.textContent = `Hai riconosciuto "${questions[currentIndex].anime}" dalla sigla!`;
            } else {
                btn.classList.add('wrong');
                wrongCount++;
                feedback.className = 'feedback show wrong';
                feedbackTitle.textContent = '❌ Sbagliato!';
                const correctAnswer = questions[currentIndex].options.find(o => o.isCorrect);
                feedbackText.textContent = `Era "${correctAnswer.text}"! Riprova con la prossima!`;
                
                allBtns.forEach(b => {
                    if (b.dataset.correct === 'true') {
                        b.classList.add('correct');
                    }
                });
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex < questions.length - 1) {
                nextBtn.textContent = 'Prossima domanda →';
            } else {
                nextBtn.textContent = 'Vedi risultati 🏆';
            }
            nextBtn.className = 'next-btn show';
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestionUI();
        }

        function showResult() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultScreen').className = 'result-screen show';
            document.getElementById('progressFill').style.width = '100%';
            
            document.getElementById('finalScore').textContent = `${correctCount}/${questions.length}`;
            
            let message = '';
            const pct = correctCount / questions.length;
            if (pct === 1) message = '🔥 Perfetto! Hai l\'orecchio di un vero otaku!';
            else if (pct >= 0.8) message = '🌟 Ottimo! Riconosci le opening come un pro!';
            else if (pct >= 0.6) message = '👏 Buon lavoro! Continua ad allenare l\'orecchio!';
            else if (pct >= 0.4) message = '📺 Non male, ma ascolta più sigle!';
            else message = '🎧 Allenati con più opening e riprova!';
            
            document.getElementById('resultMessage').textContent = message;
        }

        function restartGame() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            questions = generateQuestions();
            
            document.getElementById('resultScreen').className = 'result-screen';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            
            // Ricarica il player
            if (player) {
                player.destroy();
            }
            initPlayer();
            loadQuestionUI();
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            questions = generateQuestions();
            
            // Mostra loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('gameArea').style.display = 'none';
            
            loadYouTubeAPI();
        });

        // Player YouTube nascosto
        document.body.insertAdjacentHTML('beforeend', `
            <div id="youtubePlayer" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></div>
        `);
    </script>
