<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Anime Opening Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1e2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            padding: 20px;
        }

        .container {
            background: rgba(30, 34, 56, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #a0a6c7;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .score {
            background: #4facfe;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #fff;
            font-size: 1.1rem;
        }

        .question-counter {
            color: #b0b7d9;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding: 10px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #youtube-player-container {
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .audio-visual {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4facfe, #1a1e2f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.3);
            transition: box-shadow 0.3s ease;
            margin: 0 auto 10px;
        }

        .audio-visual.playing {
            box-shadow: 0 0 80px rgba(245, 87, 108, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .now-playing {
            text-align: center;
            font-size: 0.95rem;
            color: #7a82aa;
            margin-top: 5px;
            min-height: 28px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 8px;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            color: #f0f0f0;
            font-size: 1.2rem;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls button:hover:not(:disabled) {
            background: rgba(79, 172, 254, 0.2);
            border-color: #4facfe;
            transform: scale(1.05);
        }

        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .controls .play-btn {
            min-width: 100px;
            justify-content: center;
        }

        .cover-image {
            display: block;
            margin: 10px auto 20px;
            width: 180px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px 10px;
            color: #f0f0f0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(79, 172, 254, 0.15);
            border-color: #4facfe;
            transform: scale(1.02);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.25);
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.25);
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
        }

        .next-btn {
            display: block;
            width: 100%;
            margin: 20px auto 0;
            padding: 18px 20px;
            background: linear-gradient(135deg, #f5576c, #4facfe);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px -5px rgba(245, 87, 108, 0.4);
        }

        .next-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 12px 35px -5px rgba(79, 172, 254, 0.5);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 10px 0 0;
            min-height: 30px;
            padding: 8px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
        }

        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #f5576c;
            text-align: center;
            padding: 20px;
            background: rgba(245, 87, 108, 0.1);
            border-radius: 30px;
            border: 1px solid rgba(245, 87, 108, 0.2);
        }

        @media (max-width: 550px) {
            .container {
                padding: 20px 16px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .option-btn {
                min-height: 50px;
                padding: 14px;
            }
            .cover-image {
                width: 140px;
                height: 195px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .controls {
                gap: 10px;
                flex-wrap: wrap;
            }
            .controls button {
                font-size: 1rem;
                padding: 6px 14px;
            }
            .controls .play-btn {
                min-width: 70px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🎵 Opening Quiz</h1>
    <div class="subtitle">Ascolta l'opening e indovina l'anime!</div>

    <div class="status-bar">
        <span class="question-counter" id="questionCounter">Domanda 1 / 10</span>
        <span class="score" id="scoreDisplay">🏆 0</span>
    </div>

    <div class="player-wrapper">
        <div class="audio-visual" id="audioVisual">🔊</div>
        <div class="now-playing" id="nowPlaying">🎶 Ascolta l'opening...</div>
        <div id="youtube-player-container"></div>

        <div class="controls">
            <button id="seekBackBtn" title="Indietro 10s">⏪ -10</button>
            <button id="playPauseBtn" class="play-btn" disabled>▶️ Riproduci</button>
            <button id="seekForwardBtn" title="Avanti 10s">+10 ⏩</button>
        </div>
    </div>

    <img id="coverImage" class="cover-image" src="" alt="Copertina anime" style="display: none;">

    <div id="optionsContainer" class="options-grid"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="next-btn" disabled>➡ Prossima domanda</button>
    <div id="loader" class="loader hidden"></div>
    <div id="errorMsg" class="error-msg hidden"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    // ---------- CONFIG ----------
    const YOUTUBE_API_KEY = 'AIzaSyCXsFDpO4dYRiwlTPA4s5rbaIpCG4_7EB4';
    const ANILIST_ENDPOINT = 'https://graphql.anilist.co';
    const MAX_QUESTIONS = 10;
    const OPTIONS_COUNT = 4;

    // ---------- STATO ----------
    let animeList = [];
    let currentQuestion = 0;
    let score = 0;
    let correctAnime = null;
    let currentOptions = [];
    let isAnswered = false;
    let isPlaying = false;
    let questionsQueue = [];
    let isLoading = false;

    // YouTube player
    let ytPlayer = null;
    let currentVideoId = null;
    let playerReady = false;
    let isPaused = false;
    let pendingVideoId = null; // video da caricare quando player è pronto

    // DOM refs
    const playerContainer = document.getElementById('youtube-player-container');
    const audioVisual = document.getElementById('audioVisual');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackDiv = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCounter = document.getElementById('questionCounter');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const seekBackBtn = document.getElementById('seekBackBtn');
    const seekForwardBtn = document.getElementById('seekForwardBtn');

    // ---------- FUNZIONI DI UTILITÀ ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getAnimeTitle(anime) {
        return anime.title.romaji || anime.title.english || anime.title.native || 'Anime sconosciuto';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ---------- API ANILIST ----------
    async function fetchAnimeList() {
        const query = `
            query ($page: Int, $perPage: Int) {
                Page(page: $page, perPage: $perPage) {
                    media(sort: POPULARITY_DESC, type: ANIME, isAdult: false) {
                        id
                        title {
                            romaji
                            english
                            native
                        }
                        coverImage {
                            large
                        }
                        format
                        episodes
                        status
                        genres
                    }
                }
            }
        `;
        const variables = { page: 1, perPage: 60 };

        try {
            const response = await fetch(ANILIST_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ query, variables })
            });
            const json = await response.json();
            if (json.errors) {
                throw new Error(json.errors[0].message);
            }
            return json.data.Page.media;
        } catch (e) {
            console.error('Errore Anilist:', e);
            throw new Error('Impossibile caricare gli anime da Anilist.');
        }
    }

    // ---------- API YOUTUBE ----------
    async function searchYouTubeOpening(anime) {
        const title = getAnimeTitle(anime);
        const queries = [
            `${title} opening`,
            `${title} OP`,
            `${title} opening full`,
        ];
        for (const query of queries) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=3&key=${YOUTUBE_API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    const item = data.items[0];
                    if (item.id && item.id.videoId) {
                        return item.id.videoId;
                    }
                }
            } catch (e) {
                console.warn(`Ricerca fallita per "${query}"`, e);
            }
            await sleep(200);
        }
        return null;
    }

    // ---------- CARICAMENTO DOMANDE ----------
    async function prepareQuestions() {
        if (animeList.length === 0) {
            try {
                animeList = await fetchAnimeList();
                if (!animeList || animeList.length === 0) {
                    throw new Error('Nessun anime trovato.');
                }
                shuffleArray(animeList);
            } catch (e) {
                showError(e.message);
                return;
            }
        }

        questionsQueue = [];
        let attempts = 0;
        const maxAttempts = animeList.length * 3;
        let usedAnimeIds = new Set();

        while (questionsQueue.length < MAX_QUESTIONS && attempts < maxAttempts) {
            attempts++;
            const candidate = animeList[Math.floor(Math.random() * animeList.length)];
            if (usedAnimeIds.has(candidate.id)) continue;
            usedAnimeIds.add(candidate.id);

            const videoId = await searchYouTubeOpening(candidate);
            if (!videoId) {
                usedAnimeIds.delete(candidate.id);
                continue;
            }

            const distractors = [];
            const available = animeList.filter(a => a.id !== candidate.id && !usedAnimeIds.has(a.id));
            shuffleArray(available);
            for (let i = 0; i < 3 && i < available.length; i++) {
                distractors.push(available[i]);
            }
            if (distractors.length < 3) {
                usedAnimeIds.delete(candidate.id);
                continue;
            }

            const options = [candidate, ...distractors];
            shuffleArray(options);

            questionsQueue.push({
                anime: candidate,
                videoId: videoId,
                options: options,
            });
        }

        if (questionsQueue.length === 0) {
            throw new Error('Impossibile preparare abbastanza domande. Riprova più tardi.');
        }

        currentQuestion = 0;
        score = 0;
        updateScoreAndCounter();
        loadQuestion();
    }

    // ---------- CARICARE UNA DOMANDA ----------
    function loadQuestion() {
        if (currentQuestion >= questionsQueue.length) {
            feedbackDiv.innerHTML = `🎉 Complimenti! Hai completato il quiz. Punteggio: ${score}/${MAX_QUESTIONS}`;
            optionsContainer.innerHTML = '';
            nextBtn.disabled = true;
            audioVisual.className = 'audio-visual';
            nowPlaying.textContent = '🏁 Quiz finito!';
            coverImage.style.display = 'none';
            playPauseBtn.disabled = true;
            seekBackBtn.disabled = true;
            seekForwardBtn.disabled = true;
            if (ytPlayer) {
                ytPlayer.stopVideo();
            }
            return;
        }

        const q = questionsQueue[currentQuestion];
        correctAnime = q.anime;
        currentOptions = q.options;
        currentVideoId = q.videoId;
        isAnswered = false;
        isPaused = false;

        updateScoreAndCounter();
        feedbackDiv.innerHTML = '';
        nextBtn.disabled = true;
        coverImage.style.display = 'none';

        // Disabilita controlli finché il player non è pronto
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        playPauseBtn.textContent = '⏳ Caricamento...';

        // Carica il video
        if (ytPlayer && playerReady) {
            // Player pronto, carica subito
            ytPlayer.loadVideoById(q.videoId);
            // Forza la riproduzione dopo un breve ritardo per evitare il blocco dell'autoplay
            setTimeout(() => {
                if (ytPlayer && playerReady) {
                    ytPlayer.playVideo();
                }
            }, 300);
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = '🎵 Ascolta l\'opening...';
            isPlaying = true;
            playPauseBtn.textContent = '⏸️ Pausa';
            playPauseBtn.disabled = false;
            seekBackBtn.disabled = false;
            seekForwardBtn.disabled = false;
        } else {
            // Player non pronto, metti in coda
            pendingVideoId = q.videoId;
            nowPlaying.textContent = '🎶 Caricamento player...';
            // Se il player non esiste, verrà creato da onYouTubeIframeAPIReady
            // e poi gestirà il pending
        }

        renderOptions(q.options);
    }

    // ---------- PLAYER YOUTUBE ----------
    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('youtube-player-container', {
            height: '0',
            width: '0',
            playerVars: {
                controls: 0,
                disablekb: 1,
                modestbranding: 1,
                rel: 0,
                showinfo: 0,
                loop: 1,
                playlist: '',
                autoplay: 1,
                mute: 0,
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError: onPlayerError,
            }
        });
    }

    function onPlayerReady(event) {
        playerReady = true;
        // Se c'è un video in attesa, caricalo
        if (pendingVideoId) {
            const vid = pendingVideoId;
            pendingVideoId = null;
            ytPlayer.loadVideoById(vid);
            setTimeout(() => {
                if (ytPlayer && playerReady) {
                    ytPlayer.playVideo();
                }
            }, 300);
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = '🎵 Ascolta l\'opening...';
            isPlaying = true;
            playPauseBtn.textContent = '⏸️ Pausa';
            playPauseBtn.disabled = false;
            seekBackBtn.disabled = false;
            seekForwardBtn.disabled = false;
        } else if (currentVideoId) {
            // Caso in cui il player si è pronto dopo che loadQuestion è già stata chiamata
            // ma non c'era pending perché forse era già stato impostato
            // Ricarichiamo il video corrente
            ytPlayer.loadVideoById(currentVideoId);
            setTimeout(() => {
                if (ytPlayer && playerReady) {
                    ytPlayer.playVideo();
                }
            }, 300);
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = '🎵 Ascolta l\'opening...';
            isPlaying = true;
            playPauseBtn.textContent = '⏸️ Pausa';
            playPauseBtn.disabled = false;
            seekBackBtn.disabled = false;
            seekForwardBtn.disabled = false;
        }
    }

    function onPlayerStateChange(event) {
        const state = event.data;
        if (state === YT.PlayerState.PLAYING) {
            isPlaying = true;
            isPaused = false;
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            playPauseBtn.textContent = '⏸️ Pausa';
            playPauseBtn.disabled = false;
            seekBackBtn.disabled = false;
            seekForwardBtn.disabled = false;
        } else if (state === YT.PlayerState.PAUSED) {
            isPlaying = false;
            isPaused = true;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏸️';
            playPauseBtn.textContent = '▶️ Riproduci';
        } else if (state === YT.PlayerState.ENDED) {
            isPlaying = false;
            isPaused = true;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏹️';
            playPauseBtn.textContent = '▶️ Riproduci';
        } else if (state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.BUFFERING) {
            // Non facciamo nulla
        }
    }

    function onPlayerError(event) {
        console.error('Errore YouTube:', event.data);
        audioVisual.className = 'audio-visual';
        audioVisual.textContent = '⚠️';
        nowPlaying.textContent = '❌ Errore di riproduzione';
        feedbackDiv.innerHTML = '❌ Impossibile riprodurre l\'audio. Riprova.';
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        setTimeout(() => {
            if (!isAnswered) {
                nextBtn.disabled = false;
            }
        }, 2000);
    }

    // ---------- CONTROLLI ----------
    function togglePlayPause() {
        if (!ytPlayer || !playerReady) return;
        if (isPaused || !isPlaying) {
            ytPlayer.playVideo();
        } else {
            ytPlayer.pauseVideo();
        }
    }

    function seekBy(seconds) {
        if (!ytPlayer || !playerReady) return;
        const currentTime = ytPlayer.getCurrentTime();
        const newTime = Math.max(0, currentTime + seconds);
        ytPlayer.seekTo(newTime, true);
    }

    // ---------- RENDER OPZIONI ----------
    function renderOptions(options) {
        optionsContainer.innerHTML = '';
        options.forEach((anime, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = getAnimeTitle(anime);
            btn.dataset.index = index;
            btn.addEventListener('click', () => handleOptionClick(index));
            optionsContainer.appendChild(btn);
        });
    }

    // ---------- GESTIONE CLICK OPZIONE ----------
    function handleOptionClick(index) {
        if (isAnswered || isLoading) return;
        isAnswered = true;

        const selectedAnime = currentOptions[index];
        const isCorrect = selectedAnime.id === correctAnime.id;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            const anime = currentOptions[i];
            if (anime.id === correctAnime.id) {
                btn.classList.add('correct');
            } else if (i === index && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = '✅ Corretto! +1 punto';
            feedbackDiv.style.color = '#2ecc71';
        } else {
            feedbackDiv.innerHTML = `❌ Sbagliato! Era "${getAnimeTitle(correctAnime)}"`;
            feedbackDiv.style.color = '#e74c3c';
        }

        updateScoreAndCounter();

        if (correctAnime.coverImage && correctAnime.coverImage.large) {
            coverImage.src = correctAnime.coverImage.large;
            coverImage.style.display = 'block';
        }

        nextBtn.disabled = false;
    }

    // ---------- PROSSIMA DOMANDA ----------
    function goToNextQuestion() {
        if (isLoading) return;
        currentQuestion++;
        if (currentQuestion < questionsQueue.length) {
            loadQuestion();
        } else {
            loadQuestion(); // gestisce fine
        }
    }

    // ---------- UI HELPERS ----------
    function updateScoreAndCounter() {
        scoreDisplay.textContent = `🏆 ${score}`;
        const total = questionsQueue.length || MAX_QUESTIONS;
        questionCounter.textContent = `Domanda ${Math.min(currentQuestion + 1, total)} / ${total}`;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
        loader.classList.add('hidden');
        nextBtn.disabled = true;
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
    }

    function hideError() {
        errorMsg.classList.add('hidden');
    }

    // ---------- AVVIA IL GIOCO ----------
    async function initGame() {
        hideError();
        loader.classList.remove('hidden');
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        feedbackDiv.innerHTML = '';
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;

        try {
            await prepareQuestions();
            loader.classList.add('hidden');
            if (questionsQueue.length > 0) {
                // Se il player non è ancora pronto, loadQuestion metterà in coda il video
                // e onPlayerReady lo avvierà
                loadQuestion();
                // Se il player è già pronto, loadQuestion avvia la riproduzione
                // Se non lo è, il pending verrà gestito
            } else {
                showError('Nessuna domanda disponibile. Riprova più tardi.');
            }
        } catch (e) {
            loader.classList.add('hidden');
            showError(e.message || 'Errore durante il caricamento.');
        }
    }

    // ---------- EVENTI ----------
    nextBtn.addEventListener('click', goToNextQuestion);
    playPauseBtn.addEventListener('click', togglePlayPause);
    seekBackBtn.addEventListener('click', () => seekBy(-10));
    seekForwardBtn.addEventListener('click', () => seekBy(10));

    // ---------- AVVIO ----------
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    // Gestione del caso in cui l'API è già caricata (es. se lo script è stato eseguito dopo)
    if (typeof YT !== 'undefined' && YT.loaded) {
        onYouTubeIframeAPIReady();
    }

    window.addEventListener('load', () => {
        // Se dopo 2 secondi il player non è ancora pronto, proviamo a crearlo manualmente
        setTimeout(() => {
            if (!ytPlayer && typeof YT !== 'undefined' && YT.Player) {
                onYouTubeIframeAPIReady();
            }
            // Avvia il gioco (se non è già stato avviato)
            if (!isLoading && questionsQueue.length === 0) {
                initGame();
            }
        }, 1000);
    });

    // Fallback: se l'API non si carica affatto, iniziamo comunque dopo 5 secondi
    setTimeout(() => {
        if (!ytPlayer) {
            // Forziamo la creazione del player se possibile
            if (typeof YT !== 'undefined' && YT.Player) {
                onYouTubeIframeAPIReady();
            } else {
                // Se proprio non funziona, mostriamo un errore ma permettiamo di proseguire
                // (ma il player non funzionerà)
                console.warn('YouTube API non caricata, impossibile riprodurre audio.');
                showError('Impossibile caricare il player YouTube. Verifica la connessione.');
            }
        }
        // Avvia il gioco se non ancora avviato
        if (!isLoading && questionsQueue.length === 0) {
            initGame();
        }
    }, 5000);
</script>
