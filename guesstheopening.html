<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniQuiz - Indovina l'Opening</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ============================================================
           RESET & VARIABILI (stessi dell'index)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #22223a;
            --text-primary: #ffffff;
            --text-secondary: #8a8aa0;
            --accent-pink: #ff6b9d;
            --accent-purple: #a855f7;
            --accent-blue: #4cc9f0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #f59e0b;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 107, 157, 0.04) 0%, transparent 50%);
        }

        /* ============================================================
           NAVBAR (uguale all'index)
           ============================================================ */
        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 900;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .logo-text {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .nav-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-stats i {
            color: var(--accent-purple);
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        /* ============================================================
           OPENING GAME - STILI SPECIFICI
           ============================================================ */
        .game-container {
            padding: 40px 0 20px;
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-bar .stat i {
            color: var(--accent-purple);
        }

        .stats-bar .stat .value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Video Player */
        .video-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            position: relative;
        }

        .video-wrapper .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }

        .video-wrapper .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-secondary);
            flex-wrap: wrap;
        }

        .video-controls button {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-controls button:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .video-controls button.primary {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
        }

        .video-controls button.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .video-controls button.danger {
            background: linear-gradient(135deg, var(--accent-red), #dc2626);
            border: none;
        }

        .video-controls button.danger:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(248, 113, 113, 0.3);
        }

        .video-controls button.success {
            background: linear-gradient(135deg, var(--accent-green), #16a34a);
            border: none;
        }

        .video-controls button.success:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .option-btn:hover:not(.disabled) {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.15);
        }

        .option-btn.wrong {
            border-color: var(--accent-red);
            background: rgba(248, 113, 113, 0.15);
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn .letter {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            line-height: 28px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 10px;
            color: var(--text-secondary);
        }

        /* Feedback */
        .feedback {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--accent-purple);
            display: none;
            animation: fadeSlideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            border-left-color: var(--accent-green);
        }

        .feedback.wrong {
            border-left-color: var(--accent-red);
        }

        .feedback h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .feedback p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress */
        .progress-bar {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            height: 6px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Next button */
        .next-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .next-btn.show {
            display: block;
        }

        /* Result */
        .result-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .result-screen.show {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }

        .result-screen .big-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .result-screen h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .result-screen .score {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 12px 0;
        }

        .result-screen .restart-btn {
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .result-screen .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--bg-card);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.8rem;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .stats-bar .stat {
                justify-content: center;
            }
            .video-controls {
                flex-direction: column;
            }
            .video-controls button {
                justify-content: center;
            }
            .navbar .container {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo {
                justify-content: center;
            }
            .nav-stats {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .game-header h1 {
                font-size: 1.4rem;
            }
            .option-btn {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- ============================================================
    NAVBAR
    ============================================================ -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-mask"></i></div>
                <span class="logo-text">AniQuiz</span>
            </a>
            <div class="nav-stats">
                <a href="../index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Torna indietro
                </a>
                <span><i class="fas fa-music"></i> Opening Quiz</span>
            </div>
        </div>
    </nav>

    <!-- ============================================================
    GAME
    ============================================================ -->
    <div class="game-container">
        
        <!-- Header -->
        <div class="game-header">
            <h1>🎵 Indovina l'Opening</h1>
            <p>Ascolta la sigla e indovina l'anime!</p>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat">
                <i class="fas fa-question-circle"></i>
                Domanda: <span class="value" id="currentQuestion">0</span>/<span id="totalQuestions">10</span>
            </div>
            <div class="stat">
                <i class="fas fa-check-circle" style="color: var(--accent-green);"></i>
                Corrette: <span class="value" id="correctCount">0</span>
            </div>
            <div class="stat">
                <i class="fas fa-times-circle" style="color: var(--accent-red);"></i>
                Sbagliate: <span class="value" id="wrongCount">0</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Caricamento opening...</p>
        </div>

        <!-- Game Area -->
        <div id="gameArea" style="display: none;">
            
            <!-- Video -->
            <div class="video-wrapper">
                <div class="video-container">
                    <iframe
                        id="youtubePlayer"
                        src=""
                        title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="video-controls">
                    <button onclick="playVideo()" class="primary">
                        <i class="fas fa-play"></i> Play
                    </button>
                    <button onclick="pauseVideo()">
                        <i class="fas fa-pause"></i> Pausa
                    </button>
                    <button onclick="resetVideo()">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Options -->
            <div class="options-grid" id="optionsGrid">
                <!-- Generate via JS -->
            </div>

            <!-- Feedback -->
            <div class="feedback" id="feedback">
                <h3 id="feedbackTitle">✅ Corretto!</h3>
                <p id="feedbackText">Dettaglio</p>
            </div>

            <!-- Next Button -->
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                <i class="fas fa-arrow-right"></i> Prossima domanda
            </button>

        </div>

        <!-- Result -->
        <div class="result-screen" id="resultScreen">
            <div class="big-icon">🏆</div>
            <h2>Quiz completato!</h2>
            <div class="score" id="finalScore">0/10</div>
            <p id="resultMessage">Ottimo lavoro!</p>
            <button class="restart-btn" onclick="restartGame()">
                <i class="fas fa-redo"></i> Ricomincia
            </button>
        </div>

    </div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // DATABASE OPENING (esempio - tu puoi espanderlo)
        // ============================================================
        const OPENING_DB = [
            {
                anime: "Attack on Titan",
                videoId: "8OkpRK2_gVs", // Guren no Yumiya
                start: 0,
                duration: 30
            },
            {
                anime: "Demon Slayer",
                videoId: "pmanD_s7G3U", // Gurenge
                start: 0,
                duration: 30
            },
            {
                anime: "Naruto",
                videoId: "MvH9eu7xg3g", // Haruka Kanata
                start: 0,
                duration: 30
            },
            {
                anime: "One Piece",
                videoId: "Xa2bpzAe6Sk", // We Are!
                start: 0,
                duration: 30
            },
            {
                anime: "Dragon Ball Z",
                videoId: "9DkE6P0Dk5I", // Cha-La Head-Cha-La
                start: 0,
                duration: 30
            },
            {
                anime: "Death Note",
                videoId: "L_vyPLzBB2o", // The WORLD
                start: 0,
                duration: 30
            },
            {
                anime: "Fullmetal Alchemist: Brotherhood",
                videoId: "WAkWQsh1Ghc", // Again
                start: 0,
                duration: 30
            },
            {
                anime: "Tokyo Ghoul",
                videoId: "50VWOB1S2KM", // Unravel
                start: 0,
                duration: 30
            },
            {
                anime: "My Hero Academia",
                videoId: "P4MIXh6CrO0", // The Day
                start: 0,
                duration: 30
            },
            {
                anime: "Jujutsu Kaisen",
                videoId: "H5ahmWcG1ko", // Kaikai Kitan
                start: 0,
                duration: 30
            },
            {
                anime: "Neon Genesis Evangelion",
                videoId: "Z9LkLb-7tXo", // Zankoku na Tenshi no Thesis
                start: 0,
                duration: 30
            },
            {
                anime: "Cowboy Bebop",
                videoId: "el8A3VHnlG8", // Tank!
                start: 0,
                duration: 30
            },
            {
                anime: "Sword Art Online",
                videoId: "A3k6vj2-F9Y", // Crossing Field
                start: 0,
                duration: 30
            },
            {
                anime: "Hunter x Hunter",
                videoId: "wMTmz1F5gqQ", // Departure!
                start: 0,
                duration: 30
            },
            {
                anime: "Bleach",
                videoId: "G7vXmVoFqlY", // *~Asterisk~
                start: 0,
                duration: 30
            }
        ];

        // ============================================================
        // GAME LOGIC
        // ============================================================
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isAnswered = false;
        let totalQuestions = 10;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateQuestions() {
            const shuffled = shuffleArray([...OPENING_DB]);
            const selected = shuffled.slice(0, totalQuestions);
            
            return selected.map((item, index) => {
                const others = OPENING_DB.filter(a => a.anime !== item.anime);
                const shuffledOthers = shuffleArray([...others]).slice(0, 3);
                const options = shuffleArray([
                    { text: item.anime, isCorrect: true },
                    ...shuffledOthers.map(a => ({ text: a.anime, isCorrect: false }))
                ]);
                
                return {
                    ...item,
                    id: index,
                    options: options
                };
            });
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentIndex];
            isAnswered = false;
            
            // Aggiorna stats
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('progressFill').style.width = ((currentIndex) / questions.length * 100) + '%';

            // Carica video
            const player = document.getElementById('youtubePlayer');
            player.src = `https://www.youtube.com/embed/${q.videoId}?start=${q.start}&autoplay=1&enablejsapi=1`;
            
            // Genera opzioni
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt.text}`;
                btn.dataset.correct = opt.isCorrect;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                grid.appendChild(btn);
            });

            // Nascondi feedback e next
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            
            // Mostra game area
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('resultScreen').className = 'result-screen';
        }

        function selectOption(btn, isCorrect) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            if (isCorrect) {
                btn.classList.add('correct');
                correctCount++;
                feedback.className = 'feedback show correct';
                feedbackTitle.textContent = '✅ Corretto!';
                feedbackText.textContent = `Hai riconosciuto "${questions[currentIndex].anime}"!`;
            } else {
                btn.classList.add('wrong');
                wrongCount++;
                feedback.className = 'feedback show wrong';
                feedbackTitle.textContent = '❌ Sbagliato!';
                const correctAnswer = questions[currentIndex].options.find(o => o.isCorrect);
                feedbackText.textContent = `L'anime corretto era "${correctAnswer.text}"`;
                
                // Mostra la risposta corretta
                allBtns.forEach(b => {
                    if (b.dataset.correct === 'true') {
                        b.classList.add('correct');
                    }
                });
            }

            // Aggiorna stats
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            // Mostra next button
            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex < questions.length - 1) {
                nextBtn.textContent = 'Prossima domanda →';
            } else {
                nextBtn.textContent = 'Vedi risultati 🏆';
            }
            nextBtn.className = 'next-btn show';
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function showResult() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultScreen').className = 'result-screen show';
            document.getElementById('progressFill').style.width = '100%';
            
            document.getElementById('finalScore').textContent = `${correctCount}/${questions.length}`;
            
            let message = '';
            const pct = correctCount / questions.length;
            if (pct === 1) message = '🔥 Perfetto! Sei un vero otaku!';
            else if (pct >= 0.8) message = '🌟 Ottimo! Conosci bene le opening!';
            else if (pct >= 0.6) message = '👏 Buon lavoro! Continua così!';
            else if (pct >= 0.4) message = '📺 Non male, ma puoi fare di più!';
            else message = '🎧 Ascolta più opening e riprova!';
            
            document.getElementById('resultMessage').textContent = message;
        }

        function restartGame() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            questions = generateQuestions();
            
            document.getElementById('resultScreen').className = 'result-screen';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            
            loadQuestion();
        }

        // ============================================================
        // YOUTUBE CONTROLS
        // ============================================================
        function playVideo() {
            const player = document.getElementById('youtubePlayer');
            player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }

        function pauseVideo() {
            const player = document.getElementById('youtubePlayer');
            player.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }

        function resetVideo() {
            const player = document.getElementById('youtubePlayer');
            const q = questions[currentIndex];
            if (q) {
                player.src = `https://www.youtube.com/embed/${q.videoId}?start=${q.start}&autoplay=1&enablejsapi=1`;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            questions = generateQuestions();
            loadQuestion();
        });

        // Gestisci il caricamento del video
        document.getElementById('youtubePlayer').addEventListener('load', () => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
        });
    </script>

</body>
</html>
