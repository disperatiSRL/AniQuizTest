<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Anime Opening Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1e2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            padding: 20px;
        }

        .container {
            background: rgba(30, 34, 56, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #a0a6c7;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .score {
            background: #4facfe;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #fff;
            font-size: 1.1rem;
        }

        .question-counter {
            color: #b0b7d9;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 30px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #youtube-player {
            width: 0;
            height: 0;
            border: none;
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }

        .audio-visual {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4facfe, #1a1e2f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.3);
            transition: box-shadow 0.3s ease;
            margin: 0 auto 10px;
        }

        .audio-visual.playing {
            box-shadow: 0 0 80px rgba(245, 87, 108, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .now-playing {
            text-align: center;
            font-size: 0.85rem;
            color: #7a82aa;
            margin-top: 5px;
            min-height: 24px;
        }

        .cover-image {
            display: block;
            margin: 10px auto 20px;
            width: 180px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px 10px;
            color: #f0f0f0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(79, 172, 254, 0.15);
            border-color: #4facfe;
            transform: scale(1.02);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.25);
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.25);
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
        }

        .next-btn {
            display: block;
            width: 100%;
            margin: 20px auto 0;
            padding: 18px 20px;
            background: linear-gradient(135deg, #f5576c, #4facfe);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px -5px rgba(245, 87, 108, 0.4);
        }

        .next-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 12px 35px -5px rgba(79, 172, 254, 0.5);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 10px 0 0;
            min-height: 30px;
            padding: 8px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
        }

        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #f5576c;
            text-align: center;
            padding: 20px;
            background: rgba(245, 87, 108, 0.1);
            border-radius: 30px;
            border: 1px solid rgba(245, 87, 108, 0.2);
        }

        @media (max-width: 550px) {
            .container {
                padding: 20px 16px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .option-btn {
                min-height: 50px;
                padding: 14px;
            }
            .cover-image {
                width: 140px;
                height: 195px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🎵 Opening Quiz</h1>
    <div class="subtitle">Ascolta l'opening e indovina l'anime!</div>

    <div class="status-bar">
        <span class="question-counter" id="questionCounter">Domanda 1 / 10</span>
        <span class="score" id="scoreDisplay">🏆 0</span>
    </div>

    <div class="player-wrapper">
        <div class="audio-visual" id="audioVisual">🔊</div>
        <div class="now-playing" id="nowPlaying">🎶 In riproduzione...</div>
        <iframe id="youtube-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <img id="coverImage" class="cover-image" src="" alt="Copertina anime" style="display: none;">

    <div id="optionsContainer" class="options-grid"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="next-btn" disabled>➡ Prossima domanda</button>
    <div id="loader" class="loader hidden"></div>
    <div id="errorMsg" class="error-msg hidden"></div>
</div>

<script>
    // ---------- CONFIG ----------
    const YOUTUBE_API_KEY = 'AIzaSyCXsFDpO4dYRiwlTPA4s5rbaIpCG4_7EB4';
    const ANILIST_ENDPOINT = 'https://graphql.anilist.co';
    const MAX_QUESTIONS = 10;
    const OPTIONS_COUNT = 4;

    // ---------- STATO ----------
    let animeList = [];          // tutti gli anime caricati
    let currentQuestion = 0;
    let score = 0;
    let correctAnime = null;     // anime corrente (oggetto)
    let currentOptions = [];     // array di oggetti anime (4)
    let isAnswered = false;
    let isPlaying = false;
    let youtubeIframe = null;
    let currentVideoId = null;
    let questionsQueue = [];     // coda di domande pronte
    let isLoading = false;

    // DOM refs
    const playerIframe = document.getElementById('youtube-player');
    const audioVisual = document.getElementById('audioVisual');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackDiv = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCounter = document.getElementById('questionCounter');

    // ---------- FUNZIONI DI UTILITÀ ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getAnimeTitle(anime) {
        return anime.title.romaji || anime.title.english || anime.title.native || 'Anime sconosciuto';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ---------- API ANILIST ----------
    async function fetchAnimeList() {
        const query = `
            query ($page: Int, $perPage: Int) {
                Page(page: $page, perPage: $perPage) {
                    media(sort: POPULARITY_DESC, type: ANIME, isAdult: false) {
                        id
                        title {
                            romaji
                            english
                            native
                        }
                        coverImage {
                            large
                        }
                        format
                        episodes
                        status
                        genres
                    }
                }
            }
        `;
        const variables = { page: 1, perPage: 60 };

        try {
            const response = await fetch(ANILIST_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ query, variables })
            });
            const json = await response.json();
            if (json.errors) {
                throw new Error(json.errors[0].message);
            }
            return json.data.Page.media;
        } catch (e) {
            console.error('Errore Anilist:', e);
            throw new Error('Impossibile caricare gli anime da Anilist.');
        }
    }

    // ---------- API YOUTUBE ----------
    async function searchYouTubeOpening(anime) {
        const title = getAnimeTitle(anime);
        // Prova con "opening" e "OP"
        const queries = [
            `${title} opening`,
            `${title} OP`,
            `${title} opening full`,
        ];
        for (const query of queries) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=3&key=${YOUTUBE_API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    // Prendiamo il primo video che sembra essere un opening (escludiamo trailer, etc?)
                    // Per semplicità prendiamo il primo
                    const item = data.items[0];
                    if (item.id && item.id.videoId) {
                        return item.id.videoId;
                    }
                }
            } catch (e) {
                console.warn(`Ricerca fallita per "${query}"`, e);
            }
            // Piccola pausa per evitare rate limit
            await sleep(200);
        }
        return null;
    }

    // ---------- CARICAMENTO DOMANDE ----------
    async function prepareQuestions() {
        if (animeList.length === 0) {
            try {
                animeList = await fetchAnimeList();
                if (!animeList || animeList.length === 0) {
                    throw new Error('Nessun anime trovato.');
                }
                // Mescoliamo per varietà
                shuffleArray(animeList);
            } catch (e) {
                showError(e.message);
                return;
            }
        }

        // Prepariamo MAX_QUESTIONS domande
        questionsQueue = [];
        let attempts = 0;
        const maxAttempts = animeList.length * 3;
        let usedAnimeIds = new Set();

        while (questionsQueue.length < MAX_QUESTIONS && attempts < maxAttempts) {
            attempts++;
            const candidate = animeList[Math.floor(Math.random() * animeList.length)];
            if (usedAnimeIds.has(candidate.id)) continue;
            usedAnimeIds.add(candidate.id);

            // Cerchiamo il video su YouTube
            const videoId = await searchYouTubeOpening(candidate);
            if (!videoId) {
                // Se non troviamo video, saltiamo questo anime
                usedAnimeIds.delete(candidate.id);
                continue;
            }

            // Selezioniamo 3 distrattori (anime diversi)
            const distractors = [];
            const available = animeList.filter(a => a.id !== candidate.id && !usedAnimeIds.has(a.id));
            shuffleArray(available);
            for (let i = 0; i < 3 && i < available.length; i++) {
                distractors.push(available[i]);
            }
            if (distractors.length < 3) {
                // Se non abbiamo abbastanza distrattori, riproviamo
                usedAnimeIds.delete(candidate.id);
                continue;
            }

            // Costruiamo l'array di opzioni (mescolato)
            const options = [candidate, ...distractors];
            shuffleArray(options);

            questionsQueue.push({
                anime: candidate,
                videoId: videoId,
                options: options,
            });
        }

        if (questionsQueue.length === 0) {
            throw new Error('Impossibile preparare abbastanza domande. Riprova più tardi.');
        }

        // Reset stato
        currentQuestion = 0;
        score = 0;
        updateScoreAndCounter();
        loadQuestion();
    }

    // ---------- CARICARE UNA DOMANDA ----------
    function loadQuestion() {
        if (currentQuestion >= questionsQueue.length) {
            // Fine del quiz
            feedbackDiv.innerHTML = `🎉 Complimenti! Hai completato il quiz. Punteggio: ${score}/${MAX_QUESTIONS}`;
            optionsContainer.innerHTML = '';
            nextBtn.disabled = true;
            playerIframe.src = '';
            audioVisual.className = 'audio-visual';
            nowPlaying.textContent = '🏁 Quiz finito!';
            coverImage.style.display = 'none';
            return;
        }

        const q = questionsQueue[currentQuestion];
        correctAnime = q.anime;
        currentOptions = q.options;
        currentVideoId = q.videoId;
        isAnswered = false;
        isPlaying = false;

        // Aggiorna UI
        updateScoreAndCounter();
        feedbackDiv.innerHTML = '';
        nextBtn.disabled = true;

        // Carica il player YouTube
        loadYouTubePlayer(q.videoId);

        // Mostra cover image dell'anime corretto (opzionale, ma lo mostriamo dopo che ha risposto?)
        // Lo mostriamo subito come hint visivo? Meglio nasconderlo finché non si risponde.
        coverImage.style.display = 'none';

        // Genera opzioni
        renderOptions(q.options);

        // Reset visuale audio
        audioVisual.className = 'audio-visual';
        audioVisual.textContent = '⏳';
        nowPlaying.textContent = '🎶 Caricamento...';
    }

    // ---------- PLAYER YOUTUBE ----------
    function loadYouTubePlayer(videoId) {
        // Usiamo iframe con autoplay e parametri per nascondere controlli
        const src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0&showinfo=0&loop=1&playlist=${videoId}&mute=0`;
        playerIframe.src = src;

        // Quando il video è caricato, cambiamo icona
        playerIframe.onload = () => {
            // Non possiamo sapere quando l'audio è realmente partito, ma diamo per buono
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = `🎵 In riproduzione: ${getAnimeTitle(correctAnime)}`;
            isPlaying = true;
        };

        // Se l'iframe non si carica (errore), gestiamo
        playerIframe.onerror = () => {
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⚠️';
            nowPlaying.textContent = '❌ Errore di riproduzione';
            feedbackDiv.innerHTML = '❌ Impossibile riprodurre l\'audio. Riprova.';
            // Permettiamo di passare alla prossima dopo un po'
            setTimeout(() => {
                if (!isAnswered) {
                    // Saltiamo questa domanda?
                    // meglio dare all'utente la possibilità di andare avanti
                    nextBtn.disabled = false;
                }
            }, 2000);
        };
    }

    // ---------- RENDER OPZIONI ----------
    function renderOptions(options) {
        optionsContainer.innerHTML = '';
        options.forEach((anime, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = getAnimeTitle(anime);
            btn.dataset.index = index;
            btn.addEventListener('click', () => handleOptionClick(index));
            optionsContainer.appendChild(btn);
        });
    }

    // ---------- GESTIONE CLICK OPZIONE ----------
    function handleOptionClick(index) {
        if (isAnswered || isLoading) return;
        isAnswered = true;

        const selectedAnime = currentOptions[index];
        const isCorrect = selectedAnime.id === correctAnime.id;

        // Disabilita tutti i pulsanti
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            const anime = currentOptions[i];
            if (anime.id === correctAnime.id) {
                btn.classList.add('correct');
            } else if (i === index && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        // Aggiorna punteggio
        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = '✅ Corretto! +1 punto';
            feedbackDiv.style.color = '#2ecc71';
        } else {
            feedbackDiv.innerHTML = `❌ Sbagliato! Era "${getAnimeTitle(correctAnime)}"`;
            feedbackDiv.style.color = '#e74c3c';
        }

        updateScoreAndCounter();

        // Mostra la cover dell'anime corretto
        if (correctAnime.coverImage && correctAnime.coverImage.large) {
            coverImage.src = correctAnime.coverImage.large;
            coverImage.style.display = 'block';
        }

        // Ferma l'audio? Lo lasciamo continuare, ma possiamo fermarlo? Non importante.

        // Abilita il pulsante "Prossima"
        nextBtn.disabled = false;
    }

    // ---------- PROSSIMA DOMANDA ----------
    function goToNextQuestion() {
        if (isLoading) return;
        currentQuestion++;
        if (currentQuestion < questionsQueue.length) {
            loadQuestion();
        } else {
            // Fine quiz
            loadQuestion(); // gestisce il caso fine
        }
    }

    // ---------- UI HELPERS ----------
    function updateScoreAndCounter() {
        scoreDisplay.textContent = `🏆 ${score}`;
        const total = questionsQueue.length || MAX_QUESTIONS;
        questionCounter.textContent = `Domanda ${Math.min(currentQuestion + 1, total)} / ${total}`;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
        loader.classList.add('hidden');
        nextBtn.disabled = true;
    }

    function hideError() {
        errorMsg.classList.add('hidden');
    }

    // ---------- AVVIA IL GIOCO ----------
    async function initGame() {
        hideError();
        loader.classList.remove('hidden');
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        feedbackDiv.innerHTML = '';

        try {
            await prepareQuestions();
            loader.classList.add('hidden');
            if (questionsQueue.length > 0) {
                loadQuestion();
            } else {
                showError('Nessuna domanda disponibile. Riprova più tardi.');
            }
        } catch (e) {
            loader.classList.add('hidden');
            showError(e.message || 'Errore durante il caricamento.');
        }
    }

    // ---------- EVENTI ----------
    nextBtn.addEventListener('click', goToNextQuestion);

    // ---------- AVVIO ----------
    window.addEventListener('load', () => {
        initGame();
    });

    // Gestione errore iframe (se non si carica)
    playerIframe.addEventListener('error', () => {
        // Già gestito in onerror
    });

    // Se l'utente clicca su "Prossima" mentre è ancora in caricamento, non fare nulla
    // (già gestito da isLoading)

    // Funzione per ricaricare il gioco (se necessario)
    window.restartGame = initGame;
</script>

</body>
</html>
