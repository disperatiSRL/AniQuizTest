<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniQuiz - Indovina l'Opening</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ... STESSO STILE DI PRIMA ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #22223a;
            --text-primary: #ffffff;
            --text-secondary: #8a8aa0;
            --accent-pink: #ff6b9d;
            --accent-purple: #a855f7;
            --accent-blue: #4cc9f0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #f59e0b;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 107, 157, 0.04) 0%, transparent 50%);
        }

        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 900;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .logo-text {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .nav-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-stats i {
            color: var(--accent-purple);
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        .game-container {
            padding: 40px 0 20px;
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .game-header .audio-badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .game-header .audio-badge i {
            margin-right: 8px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-bar .stat i {
            color: var(--accent-purple);
        }

        .stats-bar .stat .value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .audio-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .audio-visual {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(255, 107, 157, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(168, 85, 247, 0.2);
            transition: var(--transition);
        }

        .audio-visual.playing {
            animation: pulse 1.5s ease-in-out infinite;
            border-color: var(--accent-purple);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.15);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.1);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 60px rgba(168, 85, 247, 0.2);
            }
        }

        .audio-visual .anime-cover {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-secondary);
            border: 3px solid rgba(255, 255, 255, 0.05);
        }

        .audio-visual .play-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .audio-visual .play-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.5);
        }

        .audio-visual .play-icon i {
            margin-left: 4px;
        }

        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-top: 16px;
        }

        .waveform .bar {
            width: 4px;
            height: 10px;
            background: var(--accent-purple);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .waveform.playing .bar {
            animation: wave 0.8s ease-in-out infinite alternate;
        }

        .waveform.playing .bar:nth-child(1) { animation-delay: 0s; height: 20px; }
        .waveform.playing .bar:nth-child(2) { animation-delay: 0.1s; height: 35px; }
        .waveform.playing .bar:nth-child(3) { animation-delay: 0.2s; height: 25px; }
        .waveform.playing .bar:nth-child(4) { animation-delay: 0.3s; height: 40px; }
        .waveform.playing .bar:nth-child(5) { animation-delay: 0.4s; height: 30px; }
        .waveform.playing .bar:nth-child(6) { animation-delay: 0.5s; height: 45px; }
        .waveform.playing .bar:nth-child(7) { animation-delay: 0.6s; height: 20px; }
        .waveform.playing .bar:nth-child(8) { animation-delay: 0.7s; height: 35px; }
        .waveform.playing .bar:nth-child(9) { animation-delay: 0.8s; height: 25px; }
        .waveform.playing .bar:nth-child(10) { animation-delay: 0.9s; height: 40px; }
        .waveform.playing .bar:nth-child(11) { animation-delay: 0.2s; height: 30px; }
        .waveform.playing .bar:nth-child(12) { animation-delay: 0.5s; height: 20px; }

        @keyframes wave {
            0% { height: 10px; }
            100% { height: 45px; }
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .audio-controls button {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-controls button:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .audio-controls button.primary {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
        }

        .audio-controls button.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .timer {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .timer .time {
            color: var(--text-primary);
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .option-btn:hover:not(.disabled) {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.15);
        }

        .option-btn.wrong {
            border-color: var(--accent-red);
            background: rgba(248, 113, 113, 0.15);
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn .letter {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            line-height: 28px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 10px;
            color: var(--text-secondary);
        }

        .feedback {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--accent-purple);
            display: none;
            animation: fadeSlideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            border-left-color: var(--accent-green);
        }

        .feedback.wrong {
            border-left-color: var(--accent-red);
        }

        .feedback h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .feedback p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            height: 6px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 0.5s ease;
            width: 0%;
        }

        .next-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .next-btn.show {
            display: block;
        }

        .result-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .result-screen.show {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }

        .result-screen .big-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .result-screen h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .result-screen .score {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 12px 0;
        }

        .result-screen .restart-btn {
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .result-screen .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--bg-card);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .loading .loading-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .loading .loading-error {
            color: var(--accent-red);
            font-size: 0.9rem;
            margin-top: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.8rem;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .stats-bar .stat {
                justify-content: center;
            }
            .audio-visual {
                width: 150px;
                height: 150px;
            }
            .audio-visual .anime-cover {
                width: 120px;
                height: 120px;
            }
            .audio-visual .play-icon {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .navbar .container {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo {
                justify-content: center;
            }
            .nav-stats {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .game-header h1 {
                font-size: 1.4rem;
            }
            .option-btn {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
            .audio-wrapper {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-mask"></i></div>
                <span class="logo-text">AniQuiz</span>
            </a>
            <div class="nav-stats">
                <a href="../index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Torna indietro
                </a>
                <span><i class="fas fa-youtube"></i> YouTube</span>
            </div>
        </div>
    </nav>

    <div class="game-container">
        
        <div class="game-header">
            <h1>🎵 Indovina l'Opening</h1>
            <p>🔍 Cerca su YouTube in tempo reale</p>
            <div class="audio-badge">
                <i class="fas fa-headphones"></i> Solo Audio
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat">
                <i class="fas fa-question-circle"></i>
                Domanda: <span class="value" id="currentQuestion">0</span>/<span id="totalQuestions">10</span>
            </div>
            <div class="stat">
                <i class="fas fa-check-circle" style="color: var(--accent-green);"></i>
                Corrette: <span class="value" id="correctCount">0</span>
            </div>
            <div class="stat">
                <i class="fas fa-times-circle" style="color: var(--accent-red);"></i>
                Sbagliate: <span class="value" id="wrongCount">0</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Caricamento in corso...</p>
            <p class="loading-sub" id="loadingSub">Caricamento anime da AniList...</p>
            <p class="loading-error" id="loadingError"></p>
        </div>

        <div id="gameArea" style="display: none;">
            
            <div class="audio-wrapper">
                <div class="audio-visual" id="audioVisual">
                    <img 
                        class="anime-cover" 
                        id="animeCover" 
                        src="" 
                        alt="Copertina anime"
                        onerror="this.style.display='none'"
                    />
                    <div class="play-icon" id="playBtn" onclick="togglePlay()">
                        <i class="fas fa-play"></i>
                    </div>
                </div>

                <div class="waveform" id="waveform">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>

                <div class="timer">
                    ⏱️ <span class="time" id="timerDisplay">0:00</span>
                </div>

                <div class="audio-controls">
                    <button class="primary" onclick="togglePlay()">
                        <i class="fas fa-play" id="playIcon"></i> <span id="playText">Play</span>
                    </button>
                    <button onclick="resetAudio()">
                        <i class="fas fa-undo"></i> Ripeti
                    </button>
                </div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="feedback" id="feedback">
                <h3 id="feedbackTitle">✅ Corretto!</h3>
                <p id="feedbackText">Dettaglio</p>
            </div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                <i class="fas fa-arrow-right"></i> Prossima domanda
            </button>

        </div>

        <div class="result-screen" id="resultScreen">
            <div class="big-icon">🏆</div>
            <h2>Quiz completato!</h2>
            <div class="score" id="finalScore">0/10</div>
            <p id="resultMessage">Ottimo lavoro!</p>
            <button class="restart-btn" onclick="restartGame()">
                <i class="fas fa-redo"></i> Ricomincia
            </button>
        </div>

    </div>

    <script>
        // ============================================================
        // 🔥 YOUTUBE API KEY (QUELLA DI KITSUSTREAM)
        // ============================================================
        const YOUTUBE_API_KEY = 'AIzaSyCXsFDpO4dYRiwlTPA4s5rbaIpCG4_7EB4';

        // ============================================================
        // CARICAMENTO ANIME DA ANILIST
        // ============================================================
        (function() {
            'use strict';
            const PER_PAGE = 10;
            window.allAnime = [];
            window.isDataLoaded = false;
            window.isLoading = false;

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            window.getTitle = function(media) {
                return media.title.english || media.title.romaji || media.title.native || 'Sconosciuto';
            };

            function buildMultiQuery() {
                const sorts = [
                    { sort: 'POPULARITY_DESC', page: 1 },
                    { sort: 'TRENDING_DESC', page: 1 },
                    { sort: 'SCORE_DESC', page: 1 }
                ];
                let query = 'query {';
                sorts.forEach((s, index) => {
                    const alias = `cat${index + 1}`;
                    query += `
                        ${alias}: Page(page: ${s.page}, perPage: ${PER_PAGE}) {
                            media(type: ANIME, sort: ${s.sort}, isAdult: false, status_not: NOT_YET_RELEASED) {
                                id
                                title { romaji english native }
                                coverImage { large }
                            }
                        }
                    `;
                });
                query += '}';
                return query;
            }

            async function fetchWithTimeout(url, options, timeout = 8000) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timeoutId);
                    return response;
                } catch (err) {
                    clearTimeout(timeoutId);
                    throw err;
                }
            }

            async function fetchMixedAnime() {
                const query = buildMultiQuery();
                try {
                    const response = await fetchWithTimeout('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ query })
                    }, 8000);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (data.errors) throw new Error(data.errors[0].message);
                    const allAnimeResults = [];
                    ['cat1', 'cat2', 'cat3'].forEach(cat => {
                        const categoryData = data.data[cat]?.media || [];
                        allAnimeResults.push(...categoryData);
                    });
                    const uniqueMap = new Map();
                    for (const anime of allAnimeResults) {
                        if (!uniqueMap.has(anime.id)) uniqueMap.set(anime.id, anime);
                    }
                    const result = Array.from(uniqueMap.values());
                    if (result.length < 10) throw new Error('Pochi anime');
                    return shuffleArray(result);
                } catch (err) {
                    console.warn('⚠️ AniList fallito, uso backup:', err.message);
                    return null;
                }
            }

            // 🔥 BACKUP DI 40 ANIME FAMOSI
            const BACKUP_ANIME = [

                { id: 29, title: { english: 'Neon Genesis Evangelion' }, coverImage: { large: 'https://anilist.co/img/header/30.jpg' } },
                { id: 30, title: { english: 'Gurren Lagann' }, coverImage: { large: 'https://anilist.co/img/header/2338.jpg' } }
            ];

            window.loadAnimeData = async function() {
                if (window.isLoading) return;
                if (window.isDataLoaded && window.allAnime.length > 0) return window.allAnime;
                window.isLoading = true;
                const loadingSub = document.getElementById('loadingSub');
                const loadingError = document.getElementById('loadingError');
                try {
                    if (loadingSub) loadingSub.textContent = 'Caricamento da AniList...';
                    if (loadingError) loadingError.textContent = '';
                    let data = await fetchMixedAnime();
                    if (!data || data.length < 10) {
                        if (loadingSub) loadingSub.textContent = 'AniList non risponde, uso database locale...';
                        if (loadingError) loadingError.textContent = '⚠️ Usando anime di backup';
                        data = BACKUP_ANIME.map(a => ({ id: a.id, title: a.title, coverImage: a.coverImage }));
                        await new Promise(r => setTimeout(r, 500));
                    }
                    window.allAnime = data;
                    window.isDataLoaded = true;
                    window.isLoading = false;
                    if (loadingError) loadingError.textContent = '';
                    return data;
                } catch (err) {
                    console.error(err);
                    window.isLoading = false;
                    if (loadingSub) loadingSub.textContent = 'Errore, uso database di backup...';
                    if (loadingError) loadingError.textContent = '⚠️ Usando anime di backup';
                    window.allAnime = BACKUP_ANIME.map(a => ({ id: a.id, title: a.title, coverImage: a.coverImage }));
                    window.isDataLoaded = true;
                    await new Promise(r => setTimeout(r, 500));
                    return window.allAnime;
                }
            };
        })();

        // ============================================================
        // 🔥 RICERCA VERA SU YOUTUBE (METODO KITSUSTREAM)
        // ============================================================
        async function searchYouTubeOpening(animeName) {
            // 🔥 STESSO METODO DEL BOTTONE TRAILER
            const searchQuery = `${animeName} opening`;
            
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(searchQuery)}&key=${YOUTUBE_API_KEY}&type=video`;
                console.log(`🔍 Cerco: "${searchQuery}"`);
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    console.error('Errore API YouTube:', data.error);
                    return null;
                }
                
                if (data.items && data.items.length > 0) {
                    const video = data.items[0];
                    const videoId = video.id.videoId;
                    console.log(`✅ Trovato: "${video.snippet.title}" (${videoId})`);
                    return {
                        videoId: videoId,
                        title: video.snippet.title,
                        duration: 30
                    };
                } else {
                    console.log(`❌ Nessun risultato per: ${animeName}`);
                    return null;
                }
            } catch (error) {
                console.error('Errore ricerca YouTube:', error);
                return null;
            }
        }

        // ============================================================
        // GAME LOGIC
        // ============================================================
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isAnswered = false;
        let totalQuestions = 10;
        let player = null;
        let isPlaying = false;
        let timerInterval = null;
        let currentQuestionData = null;

        function shuffleArrayLocal(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function generateQuestionsFromAnime(animeList) {
            const questions = [];
            const shuffled = shuffleArrayLocal([...animeList]);
            let loadingSub = document.getElementById('loadingSub');
            const maxAttempts = Math.min(shuffled.length, 40);

            for (let i = 0; i < maxAttempts && questions.length < totalQuestions; i++) {
                const anime = shuffled[i];
                const title = window.getTitle(anime);
                if (loadingSub) {
                    loadingSub.textContent = `🔍 Cercando su YouTube: ${title} (${questions.length + 1}/${totalQuestions})`;
                }
                const searchResult = await searchYouTubeOpening(title);
                await delay(400);
                if (!searchResult || !searchResult.videoId) continue;

                const videoId = searchResult.videoId;
                const others = animeList.filter(a => a.id !== anime.id);
                const shuffledOthers = shuffleArrayLocal([...others]);

                let distractors = [];
                for (const other of shuffledOthers) {
                    if (distractors.length >= 3) break;
                    const otherTitle = window.getTitle(other);
                    const otherSearch = await searchYouTubeOpening(otherTitle);
                    await delay(400);
                    if (otherSearch && otherSearch.videoId && otherSearch.videoId !== videoId) {
                        distractors.push({ text: otherTitle, isCorrect: false, videoId: otherSearch.videoId });
                    }
                }

                if (distractors.length < 3) {
                    const fallbackTitles = ['Naruto', 'One Piece', 'Dragon Ball Z', 'Bleach', 'Death Note', 'Attack on Titan', 'Demon Slayer'];
                    for (const fb of fallbackTitles) {
                        if (fb !== title && !distractors.some(d => d.text === fb)) {
                            const fbSearch = await searchYouTubeOpening(fb);
                            await delay(400);
                            if (fbSearch && fbSearch.videoId && fbSearch.videoId !== videoId) {
                                distractors.push({ text: fb, isCorrect: false, videoId: fbSearch.videoId });
                            }
                        }
                        if (distractors.length >= 3) break;
                    }
                }

                if (distractors.length < 3) continue;

                const options = shuffleArrayLocal([
                    { text: title, isCorrect: true, videoId: videoId },
                    ...distractors
                ]);

                questions.push({
                    anime: title,
                    videoId: videoId,
                    cover: anime.coverImage?.large || null,
                    options: options,
                    start: 0,
                    duration: 30
                });

                console.log(`✅ Aggiunta domanda ${questions.length}: ${title}`);
            }
            return questions;
        }

        // ============================================================
        // YOUTUBE PLAYER
        // ============================================================
        function loadYouTubeAPI() {
            if (window.YT) { initPlayer(); return; }
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
            window.onYouTubeIframeAPIReady = () => { initPlayer(); };
        }

        function initPlayer() {
            if (currentIndex >= questions.length) { showResult(); return; }
            const q = questions[currentIndex];
            if (!q || !q.videoId) { nextQuestion(); return; }
            if (player) { try { player.destroy(); } catch (e) {} player = null; }
            player = new YT.Player('youtubePlayer', {
                height: '0',
                width: '0',
                videoId: q.videoId,
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    showinfo: 0,
                    start: q.start || 0,
                    end: (q.start || 0) + (q.duration || 30)
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            loadQuestionUI();
            updateTimer();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            }
        }

        function onPlayerError(event) {
            console.error('Errore YouTube:', event.data);
            setTimeout(() => { nextQuestion(); }, 1000);
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            } else {
                player.playVideo();
                isPlaying = true;
                document.getElementById('playIcon').className = 'fas fa-pause';
                document.getElementById('playText').textContent = 'Pausa';
                document.getElementById('audioVisual').classList.add('playing');
                document.getElementById('waveform').classList.add('playing');
                updateTimer();
            }
        }

        function resetAudio() {
            if (!player) return;
            const q = questions[currentIndex];
            if (q) player.seekTo(q.start || 0);
            player.pauseVideo();
            isPlaying = false;
            document.getElementById('playIcon').className = 'fas fa-play';
            document.getElementById('playText').textContent = 'Play';
            document.getElementById('audioVisual').classList.remove('playing');
            document.getElementById('waveform').classList.remove('playing');
            clearInterval(timerInterval);
            updateTimer();
        }

        function updateTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime() || 0;
                    const q = questions[currentIndex];
                    const elapsed = current - (q?.start || 0);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = Math.floor(elapsed % 60);
                    document.getElementById('timerDisplay').textContent =
                        `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 100);
        }

        function loadQuestionUI() {
            if (currentIndex >= questions.length) { showResult(); return; }
            const q = questions[currentIndex];
            currentQuestionData = q;
            isAnswered = false;

            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('progressFill').style.width = ((currentIndex) / questions.length * 100) + '%';

            const cover = document.getElementById('animeCover');
            if (q.cover) { cover.src = q.cover;
                cover.style.display = 'block'; } else { cover.style.display = 'none'; }

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt.text}`;
                btn.dataset.correct = opt.isCorrect;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                grid.appendChild(btn);
            });

            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            resetAudio();
        }

        function selectOption(btn, isCorrect) {
            if (isAnswered) return;
            isAnswered = true;
            if (player && isPlaying) {
                player.pauseVideo();
                isPlaying = false;
                document.getElementById('playIcon').className = 'fas fa-play';
                document.getElementById('playText').textContent = 'Play';
                document.getElementById('audioVisual').classList.remove('playing');
                document.getElementById('waveform').classList.remove('playing');
                clearInterval(timerInterval);
            }
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            if (isCorrect) {
                btn.classList.add('correct');
                correctCount++;
                feedback.className = 'feedback show correct';
                feedbackTitle.textContent = '🎵 Perfetto!';
                feedbackText.textContent = `Hai riconosciuto "${currentQuestionData.anime}" dalla sigla!`;
            } else {
                btn.classList.add('wrong');
                wrongCount++;
                feedback.className = 'feedback show wrong';
                feedbackTitle.textContent = '❌ Sbagliato!';
                const correctAnswer = currentQuestionData.options.find(o => o.isCorrect);
                feedbackText.textContent = `Era "${correctAnswer.text}"!`;
                allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct'); });
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex < questions.length - 1) {
                nextBtn.textContent = 'Prossima domanda →';
            } else {
                nextBtn.textContent = 'Vedi risultati 🏆';
            }
            nextBtn.className = 'next-btn show';
        }

        function nextQuestion() {
            if (player) { try { player.destroy(); } catch (e) {} player = null; }
            currentIndex++;
            if (currentIndex >= questions.length) { showResult(); return; }
            document.getElementById('loading').style.display = 'block';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('loadingSub').textContent = `Caricando: ${questions[currentIndex]?.anime || '...'}`;
            setTimeout(() => { initPlayer(); }, 500);
        }

        function showResult() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultScreen').className = 'result-screen show';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('finalScore').textContent = `${correctCount}/${questions.length}`;
            let message = '';
            const pct = correctCount / questions.length;
            if (pct === 1) message = '🔥 Perfetto! Hai l\'orecchio di un vero otaku!';
            else if (pct >= 0.8) message = '🌟 Ottimo! Riconosci le opening come un pro!';
            else if (pct >= 0.6) message = '👏 Buon lavoro! Continua ad allenare l\'orecchio!';
            else if (pct >= 0.4) message = '📺 Non male, ma ascolta più sigle!';
            else message = '🎧 Allenati con più opening e riprova!';
            document.getElementById('resultMessage').textContent = message;
        }

        function restartGame() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            document.getElementById('resultScreen').className = 'result-screen';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loadingSub').textContent = 'Ricarico le opening da YouTube...';
            initGame();
        }

        async function initGame() {
            try {
                const loadingSub = document.getElementById('loadingSub');
                const loadingError = document.getElementById('loadingError');
                if (loadingSub) loadingSub.textContent = 'Caricamento anime da AniList...';
                if (loadingError) loadingError.textContent = '';
                const animeList = await window.loadAnimeData();
                if (!animeList || animeList.length < 10) throw new Error('Non abbastanza anime');
                if (loadingSub) loadingSub.textContent = 'Ricerca opening su YouTube...';
                const generatedQuestions = await generateQuestionsFromAnime(animeList);
                if (generatedQuestions.length < 3) throw new Error('Poche opening trovate su YouTube');
                questions = generatedQuestions;
                if (loadingError) loadingError.textContent = '';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('gameArea').style.display = 'none';
                if (loadingSub) loadingSub.textContent = `Caricando: ${questions[0]?.anime || '...'}`;
                loadYouTubeAPI();
            } catch (err) {
                console.error('Errore init:', err);
                document.getElementById('loading').innerHTML = `
                    <div style="color: var(--accent-red); font-size: 2rem; margin-bottom: 16px;">❌</div>
                    <p style="color: var(--text-primary); font-weight: 600;">Errore nel caricamento</p>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px;">${err.message}</p>
                    <button onclick="restartGame()" style="margin-top:20px;padding:12px 32px;background:var(--accent-purple);border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;">Riprova</button>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => { initGame(); });

        // Player YouTube nascosto
        document.body.insertAdjacentHTML('beforeend',
            `<div id="youtubePlayer" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></div>`
        );
    </script>
