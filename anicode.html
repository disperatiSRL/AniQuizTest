<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANICODE - Codenames Anime</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1a1a2e;
            --bg-card-hover: #22223a;
            --text-primary: #ffffff;
            --text-secondary: #8a8aa0;
            --accent-purple: #a855f7;
            --accent-blue: #4cc9f0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* NAVBAR */
        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.6rem; font-weight: 900; text-decoration: none; color: inherit; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, #ff6b9d, #a855f7); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; }
        .logo-text { background: linear-gradient(135deg, #ff6b9d, #a855f7, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: var(--transition); }
        .back-btn:hover { color: var(--text-primary); }

        /* CONNECTION PANEL */
        .connection-panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .connection-panel input {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.06);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            flex: 1;
            min-width: 150px;
        }
        .connection-panel button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent-purple), #7c3aed); color: #fff; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(168,85,247,0.3); }
        .btn-danger { background: var(--accent-red); color: #fff; }
        .btn-danger:hover { transform: scale(1.05); }
        .btn-success { background: var(--accent-green); color: #fff; }
        .btn-success:hover { transform: scale(1.05); }
        .status { font-size: 0.85rem; color: var(--text-secondary); }
        .status.connected { color: var(--accent-green); }
        .status.disconnected { color: var(--accent-red); }

        /* PLAYERS */
        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .player-badge {
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-badge.master { border-color: var(--accent-purple); color: var(--accent-purple); }
        .player-badge.ready { border-color: var(--accent-green); }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 700px;
            margin: 0 auto 24px;
        }
        .grid-card {
            background: var(--bg-card);
            border: 2px solid rgba(255,255,255,0.04);
            border-radius: var(--radius-sm);
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            position: relative;
        }
        .grid-card:hover:not(.revealed):not(.disabled) {
            transform: translateY(-2px);
            border-color: rgba(168,85,247,0.3);
            box-shadow: 0 8px 30px rgba(168,85,247,0.1);
        }
        .grid-card.revealed { opacity: 0.7; cursor: default; border-color: rgba(255,255,255,0.1); }
        .grid-card.revealed.team-red { border-color: var(--accent-red); background: rgba(248,113,113,0.1); }
        .grid-card.revealed.team-blue { border-color: var(--accent-blue); background: rgba(76,201,240,0.1); }
        .grid-card.revealed.assassin { border-color: #000; background: rgba(0,0,0,0.5); }
        .grid-card.disabled { cursor: not-allowed; opacity: 0.5; }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .controls button {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .controls button:hover { transform: scale(1.05); }

        .turn-indicator {
            text-align: center;
            font-size: 1.1rem;
            margin: 16px 0;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .turn-indicator .highlight { color: var(--accent-purple); font-weight: 700; }

        .clue-input {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .clue-input input {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.06);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 200px;
        }
        .clue-input input[type="number"] { width: 80px; }

        /* RESULT */
        .result-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }
        .result-screen.show { display: block; animation: fadeSlideIn 0.5s ease; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-screen .big-icon { font-size: 4rem; margin-bottom: 16px; }
        .result-screen h2 { font-size: 2rem; margin-bottom: 8px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 100%; }
            .grid-card { min-height: 60px; font-size: 0.7rem; padding: 8px 4px; }
            .connection-panel { flex-direction: column; }
            .connection-panel input { width: 100%; }
        }
        @media (max-width: 480px) {
            .grid-container { gap: 4px; }
            .grid-card { min-height: 50px; font-size: 0.6rem; padding: 4px 2px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-mask"></i></div>

    <div class="container">
        <h1 style="text-align:center; margin-bottom: 20px;">🎮 ANICODE</h1>
        <p style="text-align:center; color: var(--text-secondary); margin-bottom: 24px;">
            Il gioco di codici con gli anime
        </p>

        <!-- CONNESSIONE -->
        <div class="connection-panel" id="connectionPanel">
            <input type="text" id="playerNameInput" placeholder="Il tuo nome" value="BroAnime">
            <input type="text" id="roomInput" placeholder="Nome stanza" value="anicode">
            <button class="btn-primary" id="connectBtn">🔗 Connetti</button>

        <!-- GIOCATORI -->

        </div>

        <!-- TURNO -->
        <div class="turn-indicator" id="turnIndicator">
            💬 Aspetta che il master dia un indizio...
        </div>

        <!-- INDIZIO -->
        <div class="clue-input" id="clueInput" style="display:none;">
            <input type="text" id="clueWord" placeholder="Parola indizio...">

        <!-- GRIGLIA -->
        <div class="grid-container" id="gridContainer"></div>

        <!-- CONTROLLI -->

            <p id="resultMessage">La squadra ha vinto!</p>
            <button class="btn-primary" onclick="startNewGame()" style="padding:12px 32px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-top:16px;">🔄 Nuova partita</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- MULTIPLAYER CLIENT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 🔥 CONFIGURAZIONE
        // ============================================================
        const SERVER_URL = 'wss://anime-multiplayer-server.onrender.com'; // METTI IL TUO URL RENDER!

        // ============================================================
        // 🔥 DATABASE ANIME PER ANICODE
        // ============================================================
        const ANIME_WORDS = [
            // ANIME
            { word: 'Naruto', category: 'anime' },
            { word: 'One Piece', category: 'anime' },
            { word: 'Attack on Titan', category: 'anime' },
            { word: 'Demon Slayer', category: 'anime' },
            { word: 'Jujutsu Kaisen', category: 'anime' },
            { word: 'Death Note', category: 'anime' },
            { word: 'Fullmetal Alchemist', category: 'anime' },
            { word: 'Tokyo Ghoul', category: 'anime' },
            { word: 'My Hero Academia', category: 'anime' },
            { word: 'Sword Art Online', category: 'anime' },
            { word: 'Bleach', category: 'anime' },
            { word: 'Hunter x Hunter', category: 'anime' },
            { word: 'Cowboy Bebop', category: 'anime' },
            { word: 'Steins;Gate', category: 'anime' },
            { word: 'Code Geass', category: 'anime' },
            { word: 'Gintama', category: 'anime' },
            { word: 'Fate/Zero', category: 'anime' },
            { word: 'Re:Zero', category: 'anime' },
            { word: 'One Punch Man', category: 'anime' },
            { word: 'Mob Psycho 100', category: 'anime' },
            { word: 'Vinland Saga', category: 'anime' },
            { word: 'Spy x Family', category: 'anime' },
            { word: 'Chainsaw Man', category: 'anime' },
            { word: 'Dragon Ball Z', category: 'anime' },
            { word: 'Neon Genesis Evangelion', category: 'anime' },
            // PERSONAGGI
            { word: 'Goku', category: 'character' },
            { word: 'Luffy', category: 'character' },
            { word: 'Naruto', category: 'character' },
            { word: 'Saitama', category: 'character' },
            { word: 'Eren', category: 'character' },
            { word: 'Light Yagami', category: 'character' },
            { word: 'L', category: 'character' },
            { word: 'Edward Elric', category: 'character' },
            { word: 'Ken Kaneki', category: 'character' },
            { word: 'Gojo Satoru', category: 'character' },
            { word: 'Tanjiro', category: 'character' },
            { word: 'Nezuko', category: 'character' },
            { word: 'Kirito', category: 'character' },
            { word: 'Asuna', category: 'character' },
            { word: 'Spike', category: 'character' },
            { word: 'Lelouch', category: 'character' },
            { word: 'Okabe', category: 'character' },
            { word: 'Gintoki', category: 'character' },
            // STUDIO
            { word: 'Madhouse', category: 'studio' },
            { word: 'Kyoto Animation', category: 'studio' },
            { word: 'Bones', category: 'studio' },
            { word: 'A-1 Pictures', category: 'studio' },
            { word: 'Ufotable', category: 'studio' },
            { word: 'WIT Studio', category: 'studio' },
            { word: 'Mappa', category: 'studio' },
            { word: 'Studio Pierrot', category: 'studio' },
            { word: 'Production I.G', category: 'studio' },
            { word: 'Toei Animation', category: 'studio' },
            // GENERI
            { word: 'Shonen', category: 'genre' },
            { word: 'Seinen', category: 'genre' },
            { word: 'Isekai', category: 'genre' },
            { word: 'Slice of Life', category: 'genre' },
            { word: 'Mecha', category: 'genre' },
            { word: 'Romance', category: 'genre' },
            { word: 'Comedy', category: 'genre' },
            { word: 'Horror', category: 'genre' },
            { word: 'Fantasy', category: 'genre' },
            { word: 'Sci-Fi', category: 'genre' },
            // ALTRO
            { word: 'Shinigami', category: 'other' },
            { word: 'Nakama', category: 'other' },
            { word: 'Kage', category: 'other' },
            { word: 'Sensei', category: 'other' },
            { word: 'Tsundere', category: 'other' },
        ];

        // ============================================================
        // 🔥 STATO DEL GIOCO
        // ============================================================
        let gameState = {
            grid: [],
            teamRed: [],
            teamBlue: [],
            assassin: null,
            revealed: [],
            currentTurn: 'red',
            gameOver: false,
            master: null,
            players: {}
        };

        let isConnected = false;
        let myPlayerId = null;
        let currentRoom = null;
        let isMaster = false;
        let isReady = false;

        // ============================================================
        // 🔥 MULTIPLAYER CLIENT (IN LINEA SENZA IMPORT)
        // ============================================================
        const Multiplayer = {
            ws: null,
            isConnected: false,
            myPlayerId: null,
            currentRoom: null,
            currentPlayerName: null,
            eventHandlers: {
                connected: [],
                disconnected: [],
                players: [],
                playerJoined: [],
                playerLeft: [],
                state: [],
                action: [],
                ready: [],
                error: []
            },

            connect(serverUrl, options) {
                const self = this;
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.close();
                }

                this.ws = new WebSocket(serverUrl);

                this.ws.onopen = () => {
                    console.log('WebSocket aperto');
                    const payload = {
                        type: 'connect',
                        playerName: options.playerName || 'Anonimo',
                        room: options.room || 'default'
                    };
                    this.ws.send(JSON.stringify(payload));
                };

                this.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 Ricevuto:', data);
                        this._handleMessage(data);
                    } catch (e) {
                        console.error('Errore parsing:', e);
                    }
                };

                this.ws.onclose = () => {
                    console.log('WebSocket chiuso');
                    this.isConnected = false;
                    this._emit('disconnected');
                };

                this.ws.onerror = (err) => {
                    console.error('Errore WebSocket:', err);
                    this._emit('error', 'Errore di connessione');
                };
            },

            _handleMessage(data) {
                switch (data.type) {
                    case 'connected':
                        this.isConnected = true;
                        this.myPlayerId = data.playerId;
                        this.currentRoom = data.room;
                        this.currentPlayerName = data.playerName;
                        this._emit('connected', data);
                        break;
                    case 'players':
                        this._emit('players', data.players);
                        break;
                    case 'playerJoined':
                        this._emit('playerJoined', data.player);
                        break;
                    case 'playerLeft':
                        this._emit('playerLeft', data.playerId);
                        break;
                    case 'state':
                        this._emit('state', data.state);
                        break;
                    case 'action':
                        this._emit('action', data.playerId, data.action, data.data);
                        break;
                    case 'ready':
                        this._emit('ready', data.playerId, data.ready);
                        break;
                    case 'error':
                        this._emit('error', data.message);
                        break;
                    default:
                        console.log('Tipo sconosciuto:', data.type);
                }
            },

            sendAction(action, data = {}) {
                if (!this.isConnected || !this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    console.log('Non connesso');
                    return;
                }
                this.ws.send(JSON.stringify({
                    type: 'action',
                    action: action,
                    data: data
                }));
            },

            sendState(state) {
                if (!this.isConnected || !this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    console.log('Non connesso');
                    return;
                }
                this.ws.send(JSON.stringify({
                    type: 'state',
                    state: state
                }));
            },

            setReady(ready) {
                if (!this.isConnected || !this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    console.log('Non connesso');
                    return;
                }
                this.ws.send(JSON.stringify({
                    type: 'ready',
                    ready: ready
                }));
            },

            leave() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'leave' }));
                    this.ws.close();
                }
                this.ws = null;
                this.isConnected = false;
            },

            on(event, callback) {
                if (this.eventHandlers[event]) {
                    this.eventHandlers[event].push(callback);
                }
            },

            _emit(event, ...data) {
                if (this.eventHandlers[event]) {
                    this.eventHandlers[event].forEach(fn => fn(...data));
                }
            }
        };

        // ============================================================
        // 🔥 GAME LOGIC
        // ============================================================
        function generateGrid() {
            const shuffled = shuffleArray([...ANIME_WORDS]);
            const selected = shuffled.slice(0, 25);
            
            // Assegna 9 rosse, 8 blu, 1 assassino, 7 neutre
            const colors = [];
            for (let i = 0; i < 9; i++) colors.push('red');
            for (let i = 0; i < 8; i++) colors.push('blue');
            colors.push('assassin');
            for (let i = 0; i < 7; i++) colors.push('neutral');
            
            const shuffledColors = shuffleArray(colors);
            
            const grid = selected.map((item, index) => ({
                word: item.word,
                category: item.category,
                color: shuffledColors[index] || 'neutral',
                revealed: false
            }));
            
            return grid;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            const grid = generateGrid();
            gameState.grid = grid;
            gameState.revealed = [];
            gameState.currentTurn = 'red';
            gameState.gameOver = false;
            gameState.master = null;
            
            // Trova il master (il primo giocatore nella lista)
            const players = Object.values(gameState.players);
            if (players.length > 0) {
                gameState.master = players[0].id;
            }
            
            renderGrid();
            updateTurnIndicator();
            document.getElementById('resultScreen').classList.remove('show');
            
            // Sincronizza lo stato
            syncState();
        }

        function syncState() {
            const stateToSend = {
                grid: gameState.grid.map(c => ({ word: c.word, color: c.color, revealed: c.revealed })),
                currentTurn: gameState.currentTurn,
                gameOver: gameState.gameOver,
                master: gameState.master
            };
            Multiplayer.sendState(stateToSend);
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            gameState.grid.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = 'grid-card';
                div.textContent = cell.word;
                div.dataset.index = index;
                
                if (cell.revealed) {
                    div.classList.add('revealed');
                    if (cell.color === 'red') div.classList.add('team-red');
                    else if (cell.color === 'blue') div.classList.add('team-blue');
                    else if (cell.color === 'assassin') div.classList.add('assassin');
                }
                
                // Solo il master vede i colori
                if (isMaster && !cell.revealed) {
                    div.style.borderColor = cell.color === 'red' ? 'var(--accent-red)' :
                                          cell.color === 'blue' ? 'var(--accent-blue)' :
                                          cell.color === 'assassin' ? '#000' : 'rgba(255,255,255,0.1)';
                    div.style.borderWidth = '2px';
                    div.style.borderStyle = 'dashed';
                }
                
                div.addEventListener('click', () => onCardClick(index));
                container.appendChild(div);
            });
        }

        function onCardClick(index) {
            if (gameState.gameOver) return;
            if (gameState.grid[index].revealed) return;
            if (!isMaster) {
                // Solo il master può rivelare le carte
                return;
            }
            
            const cell = gameState.grid[index];
            cell.revealed = true;
            gameState.revealed.push(index);
            
            // Controlla se è assassin
            if (cell.color === 'assassin') {
                gameState.gameOver = true;
                const winner = gameState.currentTurn === 'red' ? 'Blu' : 'Rossa';
                showResult(`💀 Assassin!`, `La squadra ${winner} ha vinto!`);
            }
            
            // Controlla se la squadra ha finito le carte
            const currentColor = gameState.currentTurn;
            const remaining = gameState.grid.filter(c => !c.revealed && c.color === currentColor);
            if (remaining.length === 0) {
                gameState.gameOver = true;
                const teamName = currentColor === 'red' ? 'Rossa' : 'Blu';
                showResult(`🏆 Vittoria!`, `La squadra ${teamName} ha vinto!`);
            }
            
            // Passa il turno
            gameState.currentTurn = gameState.currentTurn === 'red' ? 'blue' : 'red';
            
            renderGrid();
            updateTurnIndicator();
            syncState();
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            const turn = gameState.currentTurn === 'red' ? '🔴 Rossa' : '🔵 Blu';
            indicator.innerHTML = `🎯 Turno della squadra <span class="highlight">${turn}</span>`;
        }

        function showResult(title, message) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultScreen').classList.add('show');
        }

        function startNewGame() {
            if (isMaster) {
                initGame();
            } else {
                alert('Solo il master può iniziare una nuova partita!');
            }
        }

        // ============================================================
        // 🔥 UI EVENTS
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Connessione
            document.getElementById('connectBtn').addEventListener('click', () => {
                const name = document.getElementById('playerNameInput').value || 'Anonimo';
                const room = document.getElementById('roomInput').value || 'anicode';
                
                Multiplayer.connect(SERVER_URL, {
                    playerName: name,
                    room: room
                });
            });
            
            document.getElementById('disconnectBtn').addEventListener('click', () => {
                Multiplayer.leave();
                document.getElementById('connectBtn').style.display = 'inline-block';
                document.getElementById('disconnectBtn').style.display = 'none';
                document.getElementById('statusText').textContent = '⚪ Disconnesso';
                document.getElementById('statusText').className = 'status disconnected';
            });
            
            document.getElementById('readyBtn').addEventListener('click', () => {
                isReady = !isReady;
                Multiplayer.setReady(isReady);
                document.getElementById('readyBtn').textContent = isReady ? '✅ Pronto' : '⏳ Non pronto';
                document.getElementById('readyBtn').style.background = isReady ? 'var(--accent-green)' : 'var(--bg-card)';
            });
            
            document.getElementById('newGameBtn').addEventListener('click', startNewGame);
            
            document.getElementById('clueBtn').addEventListener('click', () => {
                const word = document.getElementById('clueWord').value;
                const number = parseInt(document.getElementById('clueNumber').value) || 0;
                if (word && number > 0) {
                    Multiplayer.sendAction('clue', { word, number });
                    document.getElementById('clueWord').value = '';
                    document.getElementById('clueNumber').value = '';
                }
            });
            
            // Events Multiplayer
            Multiplayer.on('connected', (data) => {
                isConnected = true;
                myPlayerId = data.playerId;
                currentRoom = data.room;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'inline-block';
                document.getElementById('statusText').textContent = `✅ Connesso come ${data.playerName} in ${data.room}`;
                document.getElementById('statusText').className = 'status connected';
                
                // Aggiorna i giocatori
                const players = Object.values(data.players);
                gameState.players = data.players;
                updatePlayersList(players);
                
                // Se sono il primo, divento master
                if (players.length === 1) {
                    isMaster = true;
                    document.getElementById('clueInput').style.display = 'flex';
                    document.getElementById('readyBtn').style.display = 'none';
                    initGame();
                } else {
                    isMaster = false;
                    document.getElementById('clueInput').style.display = 'none';
                    document.getElementById('readyBtn').style.display = 'inline-block';
                }
            });
            
            Multiplayer.on('players', (players) => {
                gameState.players = players;
                updatePlayersList(Object.values(players));
            });
            
            Multiplayer.on('playerJoined', (player) => {
                gameState.players[player.id] = player;
                updatePlayersList(Object.values(gameState.players));
            });
            
            Multiplayer.on('playerLeft', (playerId) => {
                delete gameState.players[playerId];
                updatePlayersList(Object.values(gameState.players));
            });
            
            Multiplayer.on('state', (state) => {
                if (state.grid) {
                    gameState.grid = state.grid;
                    gameState.currentTurn = state.currentTurn || 'red';
                    gameState.gameOver = state.gameOver || false;
                    gameState.master = state.master || null;
                    renderGrid();
                    updateTurnIndicator();
                }
            });
            
            Multiplayer.on('action', (playerId, action, data) => {
                if (action === 'clue') {
                    document.getElementById('turnIndicator').innerHTML = `
                        💡 <strong>${gameState.players[playerId]?.name || 'Master'}</strong> 
                        ha dato l'indizio: <span class="highlight">"${data.word}"</span> → ${data.number}
                    `;
                }
            });
            
            Multiplayer.on('error', (msg) => {
                alert('❌ ' + msg);
            });
            
            Multiplayer.on('disconnected', () => {
                isConnected = false;
                document.getElementById('connectBtn').style.display = 'inline-block';
                document.getElementById('disconnectBtn').style.display = 'none';
                document.getElementById('statusText').textContent = '⚪ Disconnesso';
                document.getElementById('statusText').className = 'status disconnected';
            });
        });

        function updatePlayersList(players) {
            const container = document.getElementById('playersList');
            container.innerHTML = players.map(p => `
                <span class="player-badge ${p.id === gameState.master ? 'master' : ''} ${p.ready ? 'ready' : ''}">
                    ${p.id === gameState.master ? '👑 ' : ''}
                    ${p.name} 
                    ${p.ready ? '✅' : '⏳'}
                </span>
            `).join('');
        }
    </script>

</body>
</html>
